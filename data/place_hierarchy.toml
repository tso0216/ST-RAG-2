# 景點階層（草稿，待研究者審稿）
#
# 格式：TOML，每個節點一個 [[node]] 區塊。
#   name     正式名稱。必填，全檔唯一。
#   kind     "景點" 或 "區域"。選填，預設 "景點"。
#   parent   母節點的正式名稱。選填，沒寫就是最上層。
#   aliases  別名列表。選填。片段或規劃器寫成任何一個別名，都當成這個節點。
#
# 規則：
# - 名稱和別名比對時不分全形半形、大小寫，也忽略空白（「伏見稻荷大社 表參道」等於「伏見稻荷大社表參道」）。
# - 每個名稱（含別名）只能屬於一個節點；parent 必須是檔裡某個節點的正式名稱，不能繞成循環。
# - 問一個節點時，它所有子孫節點的片段都算進來；一筆都沒過門檻時，往上退一層改查母節點。
# - 第一版只做別名合併和母子關係，不用座標。
#
# 這個檔是人工成果的唯一來源，不寫進 DB。檢索時才跟 DB 的 `place` 表對應：
# `place` 表裡、這個檔沒收的名稱，會自動當成獨立節點（沒有別名、沒有母節點）。
# 重建 DB 或重新抽取後，跑 `python -m strag_v3.rag.hierarchy --db <DB>` 列出還沒收的名稱，再補進來。

# ── 東京：押上 ──────────────────────────────────────────

[[node]]
name = "押上"
kind = "區域"

[[node]]
name = "東京晴空塔城"
parent = "押上"
aliases = ["晴空塔城"]
# 整個園區：晴空塔本身，加上晴空街道等商場、餐廳

[[node]]
name = "東京晴空塔"
parent = "東京晴空塔城"
aliases = ["晴空塔", "東京天空樹", "天空樹"]

[[node]]
name = "東京晴空塔天望甲板"
parent = "東京晴空塔"
aliases = ["天望甲板", "晴空塔天望甲板"]

[[node]]
name = "北十間川"
parent = "押上"

